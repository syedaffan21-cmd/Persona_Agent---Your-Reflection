<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Twin</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex overflow-hidden">

    <aside class="w-72 bg-slate-950 border-r border-slate-800 flex flex-col justify-between">
        <div>
            <div class="p-4 border-b border-slate-800">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Persona</span>
                    <button onclick="openPersonaModal()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> New Persona
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <select id="personaSelect" onchange="changePersona(this.value)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="My Personal Twin">My Personal Twin</option>
                    </select>
                    <button onclick="deleteCurrentPersona()" class="bg-slate-900 hover:bg-rose-950/50 border border-slate-700 hover:border-rose-800 text-slate-400 hover:text-rose-400 p-2 rounded-lg text-sm transition" title="Delete current persona">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
                <button onclick="openTrainModal()" class="mt-3 w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium py-1.5 px-3 rounded-lg text-xs flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-graduation-cap text-indigo-400"></i> Train Current Persona
                </button>
            </div>

            <div class="p-4">
                <button onclick="startNewChat()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-xl text-sm flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
            </div>

            <div class="px-4 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider">Chat History</div>
            <div id="chatHistoryList" class="overflow-y-auto px-2 space-y-1 h-[calc(100vh-320px)]"></div>
        </div>

        <div class="p-4 border-t border-slate-800 flex items-center justify-between text-sm text-slate-400">
            <span class="flex items-center gap-2"><i class="fa-solid fa-circle text-emerald-400 text-xs"></i> Online</span>
            <span class="text-xs text-slate-500">v2.2</span>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full bg-slate-900">
        
        <header class="bg-slate-900/85 backdrop-blur border-b border-slate-800 p-4 flex justify-between items-center">
            <h1 id="activeChatTitle" class="text-base font-semibold text-slate-200">New Conversation</h1>
            <div class="text-xs text-slate-400 flex items-center gap-2">
                <span>Status:</span> <span id="status" class="text-emerald-400 font-medium">Connected</span>
            </div>
        </header>

        <div id="chatWindow" class="flex-1 overflow-y-auto p-6 space-y-6"></div>

        <div id="uploadStatus" class="px-6 text-xs text-slate-400 h-5"></div>

        <div class="p-4 bg-slate-900 border-t border-slate-800">
            <div id="attachmentPreview" class="hidden max-w-4xl mx-auto mb-2 flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-xs text-slate-300 w-fit">
                <i class="fa-solid fa-file text-indigo-400"></i>
                <span id="attachmentFileName" class="truncate max-w-xs"></span>
                <button onclick="clearAttachment()" class="text-slate-400 hover:text-rose-400 ml-2" title="Remove attachment">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex items-center gap-2 max-w-4xl mx-auto bg-slate-800/80 border border-slate-700/80 rounded-2xl px-3 py-2 shadow-lg focus-within:border-indigo-500 transition">
                
                <button onclick="document.getElementById('chatFileInput').click()" aria-label="Share File with Agent" class="text-slate-400 hover:text-slate-200 p-2 rounded-xl transition" title="Share file/photo with agent">
                    <i class="fa-solid fa-paperclip text-lg"></i>
                </button>
                <input type="file" id="chatFileInput" class="hidden">

                <button onclick="toggleVoiceInput()" id="voiceBtn" aria-label="Voice Input" class="text-slate-400 hover:text-slate-200 p-2 rounded-xl transition relative" title="Click to speak">
                    <i id="voiceIcon" class="fa-solid fa-microphone text-lg"></i>
                </button>

                <input type="text" id="userInput" placeholder="Type a message to your twin..." class="flex-1 bg-transparent border-none px-2 py-2 text-sm text-slate-100 focus:outline-none" onkeypress="handleKeyPress(event)">

                <button onclick="sendMessage(false)" aria-label="Send Message" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center justify-center">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal for Creating New Persona -->
    <div id="personaModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-4">
            <h2 class="text-lg font-bold text-slate-100">Create New Persona</h2>
            <p class="text-xs text-slate-400">Give your new persona a name.</p>
            
            <div class="space-y-3">
                <div>
                    <label for="newPersonaName" class="block text-xs font-semibold text-slate-400 mb-1">Persona Name</label>
                    <input type="text" id="newPersonaName" placeholder="e.g., Alex, Jordan" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closePersonaModal()" class="px-4 py-2 rounded-xl text-sm bg-slate-800 hover:bg-slate-700 text-slate-300">Cancel</button>
                <button onclick="saveNewPersona()" class="px-4 py-2 rounded-xl text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Create</button>
            </div>
        </div>
    </div>

    <!-- Modal for Training Existing Persona via Website Scraping or Files -->
    <div id="trainModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-4">
            <h2 class="text-lg font-bold text-slate-100">Train Persona: <span id="trainModalPersonaName" class="text-indigo-400"></span></h2>
            <p class="text-xs text-slate-400">Provide website links to scrape or upload documents to update this persona's graph/vector memory.</p>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Upload Training Document/PDF</label>
                    <input type="file" id="trainFileInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                </div>
                <div>
                    <label for="socialProfileUrls" class="block text-xs font-semibold text-slate-400 mb-1">Website Links to Scrape (comma/space separated)</label>
                    <textarea id="socialProfileUrls" rows="3" placeholder="https://example.com/bio, https://github.com/username" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeTrainModal()" class="px-4 py-2 rounded-xl text-sm bg-slate-800 hover:bg-slate-700 text-slate-300">Cancel</button>
                <button onclick="submitPersonaTraining()" class="px-4 py-2 rounded-xl text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium">Start Training & Scraping</button>
            </div>
        </div>
    </div>

    <script>
        let allPersonaChats = JSON.parse(localStorage.getItem("persona_chats_map")) || {
            "My Personal Twin": [
                { id: Date.now(), title: "General Chat", pinned: false, messages: [] }
            ]
        };

        let savedPersonas = JSON.parse(localStorage.getItem("persona_list")) || ["My Personal Twin"];
        let currentPersona = localStorage.getItem("persona_active") || "My Personal Twin";

        if (!allPersonaChats[currentPersona]) {
            allPersonaChats[currentPersona] = [
                { id: Date.now(), title: "General Chat", pinned: false, messages: [] }
            ];
        }

        let currentChatId = parseInt(localStorage.getItem(`persona_current_chat_${currentPersona}`)) || allPersonaChats[currentPersona][0].id;
        let pendingAttachment = null; 

        function initPersonas() {
            const select = document.getElementById("personaSelect");
            select.innerHTML = "";
            savedPersonas.forEach(pName => {
                const option = document.createElement("option");
                option.value = pName;
                option.text = pName;
                if (pName === currentPersona) option.selected = true;
                select.appendChild(option);
            });
        }

        function changePersona(val) {
            currentPersona = val;
            localStorage.setItem("persona_active", val);

            if (!allPersonaChats[currentPersona] || allPersonaChats[currentPersona].length === 0) {
                allPersonaChats[currentPersona] = [
                    { id: Date.now(), title: "General Chat", pinned: false, messages: [] }
                ];
            }

            currentChatId = parseInt(localStorage.getItem(`persona_current_chat_${currentPersona}`)) || allPersonaChats[currentPersona][0].id;
            
            saveToStorage();
            renderChatHistory();
            renderCurrentChatMessages();
        }

        async function deleteCurrentPersona() {
            if (savedPersonas.length <= 1) {
                alert("You must keep at least one persona.");
                return;
            }

            if (!confirm(`Are you sure you want to delete the persona '${currentPersona}' and all its associated data/chats?`)) {
                return;
            }

            const personaToDelete = currentPersona;

            try {
                await fetch(`http://localhost:8000/persona/${encodeURIComponent(personaToDelete)}`, {
                    method: "DELETE"
                });
            } catch (err) {
                console.error("Failed to delete database records for persona:", err);
            }

            delete allPersonaChats[personaToDelete];
            localStorage.removeItem(`persona_current_chat_${personaToDelete}`);
            
            savedPersonas = savedPersonas.filter(p => p !== personaToDelete);
            currentPersona = savedPersonas[0];

            if (!allPersonaChats[currentPersona]) {
                allPersonaChats[currentPersona] = [
                    { id: Date.now(), title: "General Chat", pinned: false, messages: [] }
                ];
            }
            currentChatId = allPersonaChats[currentPersona][0].id;

            saveToStorage();
            initPersonas();
            renderChatHistory();
            renderCurrentChatMessages();

            const statusEl = document.getElementById("uploadStatus");
            statusEl.innerText = `Persona '${personaToDelete}' deleted successfully.`;
            statusEl.className = "px-6 text-xs text-rose-400 h-5";
        }

        function saveToStorage() {
            localStorage.setItem("persona_chats_map", JSON.stringify(allPersonaChats));
            localStorage.setItem(`persona_current_chat_${currentPersona}`, currentChatId);
            localStorage.setItem("persona_list", JSON.stringify(savedPersonas));
            localStorage.setItem("persona_active", currentPersona);
        }

        function getCurrentChats() {
            if (!allPersonaChats[currentPersona]) {
                allPersonaChats[currentPersona] = [
                    { id: Date.now(), title: "General Chat", pinned: false, messages: [] }
                ];
            }
            return allPersonaChats[currentPersona];
        }

        function renderChatHistory() {
            const listEl = document.getElementById("chatHistoryList");
            listEl.innerHTML = "";
            const chats = getCurrentChats();
            const sortedChats = [...chats].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

            sortedChats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const div = document.createElement("div");
                div.className = `group flex items-center justify-between px-3 py-2 rounded-xl text-sm cursor-pointer transition ${isActive ? 'bg-slate-800 text-white font-medium' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`;
                div.innerHTML = `
                    <div class="truncate flex-1 mr-2" onclick="switchChat(${chat.id})">
                        <i class="fa-regular fa-message mr-2 text-xs"></i> <span>${chat.title}</span>
                    </div>
                    <div class="hidden group-hover:flex items-center gap-1.5 text-xs">
                        <button onclick="event.stopPropagation(); togglePin(${chat.id})" aria-label="Pin Chat" class="${chat.pinned ? 'text-amber-400' : 'text-slate-500'} hover:text-slate-200" title="Pin">
                            <i class="fa-solid fa-thumbtack"></i>
                        </button>
                        <button onclick="event.stopPropagation(); deleteChat(${chat.id})" aria-label="Delete Chat" class="text-slate-500 hover:text-rose-400" title="Delete">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        function renderCurrentChatMessages() {
            const chats = getCurrentChats();
            const chat = chats.find(c => c.id === currentChatId) || chats[0];
            if (chat) currentChatId = chat.id;

            const chatWindow = document.getElementById("chatWindow");
            chatWindow.innerHTML = "";

            if (!chat || !chat.messages || chat.messages.length === 0) {
                chatWindow.innerHTML = `
                    <div class="flex justify-start">
                        <div class="bg-slate-800 border border-slate-700/60 rounded-2xl px-4 py-3 max-w-lg text-sm leading-relaxed shadow-sm text-slate-200">
                            Hey! I'm your Persona Twin (${currentPersona}). Type a message or attach a file below.
                        </div>
                    </div>
                `;
                document.getElementById("activeChatTitle").innerText = chat ? chat.title : "New Conversation";
                return;
            }

            document.getElementById("activeChatTitle").innerText = chat.title;

            chat.messages.forEach(msg => {
                if (msg.sender === "user") {
                    chatWindow.innerHTML += `
                        <div class="flex justify-end">
                            <div class="bg-indigo-600 text-white rounded-2xl px-4 py-3 max-w-lg text-sm leading-relaxed shadow-md">${msg.text || ""}</div>
                        </div>
                    `;
                } else {
                    const rawText = msg.text || "";
                    const safeText = rawText.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    chatWindow.innerHTML += `
                        <div class="flex justify-start items-end gap-2">
                            <div class="bg-slate-800 border border-slate-700/60 rounded-2xl px-4 py-3 max-w-lg text-sm leading-relaxed text-slate-200 shadow-sm">${rawText}</div>
                            <button onclick="speakText('${safeText}')" aria-label="Read Aloud" class="text-slate-400 hover:text-indigo-400 p-1.5 transition mb-1" title="Read Aloud">
                                <i class="fa-solid fa-volume-high text-xs"></i>
                            </button>
                        </div>
                    `;
                }
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Natural') || v.name.includes('Google') || v.lang.includes('en-US'));
            if (preferredVoice) utterance.voice = preferredVoice;
            window.speechSynthesis.speak(utterance);
        }

        let recognition = null;
        let isListening = false;

        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser.");
                return;
            }

            const voiceBtn = document.getElementById("voiceBtn");
            const voiceIcon = document.getElementById("voiceIcon");

            if (isListening) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                voiceBtn.classList.add("text-rose-400", "animate-pulse");
                voiceIcon.className = "fa-solid fa-microphone-slash text-lg";
                document.getElementById("uploadStatus").innerText = "Listening... Speak now.";
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                document.getElementById("userInput").value = speechToText;
                document.getElementById("uploadStatus").innerText = "";
                sendMessage(true);
            };

            recognition.onerror = () => {
                document.getElementById("uploadStatus").innerText = "Voice recognition error.";
                stopListeningState();
            };

            recognition.onend = () => {
                stopListeningState();
            };

            recognition.start();
        }

        function stopListeningState() {
            isListening = false;
            const voiceBtn = document.getElementById("voiceBtn");
            const voiceIcon = document.getElementById("voiceIcon");
            if (voiceBtn) voiceBtn.classList.remove("text-rose-400", "animate-pulse");
            if (voiceIcon) voiceIcon.className = "fa-solid fa-microphone text-lg";
        }

        function startNewChat() {
            let chats = getCurrentChats();
            const newId = Date.now();
            chats.unshift({ id: newId, title: `${currentPersona} Chat`, pinned: false, messages: [] });
            currentChatId = newId;
            saveToStorage();
            renderChatHistory();
            renderCurrentChatMessages();
        }

        function switchChat(id) {
            currentChatId = id;
            saveToStorage();
            renderChatHistory();
            renderCurrentChatMessages();
        }

        function togglePin(id) {
            let chats = getCurrentChats();
            const chat = chats.find(c => c.id === id);
            if (chat) chat.pinned = !chat.pinned;
            saveToStorage();
            renderChatHistory();
        }

        function deleteChat(id) {
            let chats = getCurrentChats();
            if (chats.length <= 1) {
                alert("You must keep at least one chat for this persona.");
                return;
            }
            allPersonaChats[currentPersona] = chats.filter(c => c.id !== id);
            saveToStorage();
            if (currentChatId === id) {
                currentChatId = allPersonaChats[currentPersona][0].id;
            }
            renderChatHistory();
            renderCurrentChatMessages();
        }

        function openPersonaModal() {
            document.getElementById("personaModal").classList.remove("hidden");
        }

        function closePersonaModal() {
            document.getElementById("personaModal").classList.add("hidden");
        }

        function openTrainModal() {
            document.getElementById("trainModalPersonaName").innerText = currentPersona;
            document.getElementById("trainModal").classList.remove("hidden");
        }

        function closeTrainModal() {
            document.getElementById("trainModal").classList.add("hidden");
        }

        async function saveNewPersona() {
            const name = document.getElementById("newPersonaName").value.trim();
            if (!name) return alert("Please enter a persona name.");

            closePersonaModal();
            if (!savedPersonas.includes(name)) {
                savedPersonas.push(name);
            }
            if (!allPersonaChats[name]) {
                allPersonaChats[name] = [
                    { id: Date.now(), title: `${name}'s First Chat`, pinned: false, messages: [] }
                ];
            }
            currentPersona = name;
            initPersonas();
            document.getElementById("personaSelect").value = name;
            currentChatId = allPersonaChats[name][0].id;
            saveToStorage();
            renderChatHistory();
            renderCurrentChatMessages();

            const statusEl = document.getElementById("uploadStatus");
            statusEl.innerText = `Persona '${name}' created. Click 'Train Current Persona' to add website links or documents.`;
            statusEl.className = "px-6 text-xs text-emerald-400 h-5";
        }

        async function submitPersonaTraining() {
            const fileInput = document.getElementById("trainFileInput");
            const socialUrlsText = document.getElementById("socialProfileUrls").value.trim();
            const socialUrls = socialUrlsText ? socialUrlsText.split(/[\s,]+/).filter(url => url.length > 0) : [];

            closeTrainModal();
            const statusEl = document.getElementById("uploadStatus");
            statusEl.innerText = `Training persona '${currentPersona}' (scraping websites & updating graph)...`;

            try {
                if (socialUrls.length > 0) {
                    await fetch("http://localhost:8000/train-persona", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name: currentPersona, social_urls: socialUrls })
                    });
                }

                if (fileInput.files && fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append("file", fileInput.files[0]);
                    formData.append("persona", currentPersona);

                    await fetch("http://localhost:8000/ingest", { method: "POST", body: formData });
                }

                statusEl.innerText = `Success! Neo4j graph & website data updated for '${currentPersona}'.`;
                statusEl.className = "px-6 text-xs text-emerald-400 h-5";
                fileInput.value = "";
                document.getElementById("socialProfileUrls").value = "";
            } catch (err) {
                statusEl.innerText = "Error completing website scraping and training.";
                statusEl.className = "px-6 text-xs text-rose-400 h-5";
            }
        }

        document.getElementById('chatFileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            pendingAttachment = file;
            document.getElementById("attachmentFileName").innerText = pendingAttachment.name;
            document.getElementById("attachmentPreview").classList.remove("hidden");
            
            const statusEl = document.getElementById("uploadStatus");
            statusEl.innerText = `File attached. Type your message and hit send.`;
            statusEl.className = "px-6 text-xs text-indigo-400 h-5";
        });

        function clearAttachment() {
            pendingAttachment = null;
            document.getElementById("chatFileInput").value = "";
            document.getElementById("attachmentPreview").classList.add("hidden");
            document.getElementById("uploadStatus").innerText = "";
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage(false);
            }
        }

        async function sendMessage(isVoiceInput) {
            const input = document.getElementById("userInput");
            const message = input.value.trim();
            
            if (!message && !pendingAttachment) return;

            let chats = getCurrentChats();
            let chat = chats.find(c => c.id === currentChatId);
            if (!chat) {
                chat = chats[0];
                currentChatId = chat.id;
            }

            if (chat.messages.length === 0 && chat.title.includes("Chat")) {
                chat.title = message.length > 20 ? message.substring(0, 20) + "..." : (pendingAttachment ? pendingAttachment.name : "Chat");
            }

            if (!chat.messages) chat.messages = [];

            let displayMessage = message;
            if (pendingAttachment) {
                displayMessage = message ? `${message} [Attached: ${pendingAttachment.name}]` : `[Shared file: ${pendingAttachment.name}]`;
            }

            chat.messages.push({ sender: "user", text: displayMessage });
            
            const fileToSend = pendingAttachment;
            input.value = "";
            clearAttachment();
            
            saveToStorage();
            renderChatHistory();
            renderCurrentChatMessages();

            const chatWindow = document.getElementById("chatWindow");
            const loadingId = "loading_" + Date.now();
            chatWindow.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-slate-800 border border-slate-700/60 rounded-2xl px-4 py-3 max-w-lg text-sm leading-relaxed text-slate-400 shadow-sm">
                        Thinking...
                    </div>
                </div>
            `;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const formData = new FormData();
                formData.append("message", displayMessage);
                formData.append("persona", currentPersona);
                
                if (fileToSend) {
                    formData.append("file", fileToSend);
                }

                const response = await fetch("http://localhost:8000/chat", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                chat.messages.push({ sender: "bot", text: data.response });
                saveToStorage();
                renderCurrentChatMessages();

                if (isVoiceInput) {
                    speakText(data.response);
                }

            } catch (err) {
                document.getElementById(loadingId)?.remove();
                const errText = "Failed to reach backend server.";
                chat.messages.push({ sender: "bot", text: errText });
                saveToStorage();
                renderCurrentChatMessages();
                if (isVoiceInput) speakText(errText);
            }
        }

        initPersonas();
        renderChatHistory();
        renderCurrentChatMessages();
    </script>
</body>
</html>
